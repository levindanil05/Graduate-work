{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block auth_title %}Вход{% endblock %} · {{ branding.organization_short_name }}</title>
    <link rel="icon" href="{% static branding.favicon %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'ui/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'ui/layout.css' %}">
    <link rel="stylesheet" href="{% static 'ui/components.css' %}">
    <style>
        :root {
            --color-primary: {{ branding.primary_color }};
            --color-accent: {{ branding.accent_color }};
        }
    </style>
</head>
<body class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <img src="{% static branding.logo %}" alt="{{ branding.organization_short_name }}" width="200" height="48">
        </div>
        {% block auth_content %}{% endblock %}
    </div>
    <p class="auth-footer">{{ branding.footer_text }}</p>
</body>
</html>
