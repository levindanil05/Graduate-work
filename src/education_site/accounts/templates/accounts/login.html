{% extends "ui/auth_layout.html" %}

{% block auth_title %}Вход в систему{% endblock %}

{% block auth_content %}
<h1 class="page-title" style="margin-top:0">Вход в систему</h1>
{% if error %}
<p class="field-error">{{ error }}</p>
{% endif %}
<form method="post" class="form-stack">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <p>
        <label for="id_username">Логин</label>
        <input id="id_username" name="username" autocomplete="username" required>
    </p>
    <p>
        <label for="id_password">Пароль</label>
        <input id="id_password" type="password" name="password" autocomplete="current-password" required>
    </p>
    <button type="submit" class="btn btn-primary" style="width:100%">Войти</button>
</form>
<p class="hint-box" style="margin-top:1.5rem;font-size:0.9rem">
    Самостоятельная регистрация отключена. Учётную запись создаёт администратор.
</p>
{% endblock %}
