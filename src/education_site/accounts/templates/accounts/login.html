<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Вход в систему</title>
    <style>
        body { font-family: sans-serif; margin: 2rem auto; max-width: 360px; }
        label { display: block; margin: 0.75rem 0 0.25rem; }
        input { width: 100%; box-sizing: border-box; padding: 0.4rem; }
        button { margin-top: 1rem; padding: 0.5rem 1rem; }
        .error { color: #b00020; margin: 0.75rem 0; }
    </style>
</head>
<body>
    <h1>Вход в систему</h1>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label for="id_username">Логин</label>
        <input id="id_username" name="username" autocomplete="username" required>
        <label for="id_password">Пароль</label>
        <input id="id_password" type="password" name="password" autocomplete="current-password" required>
        <button type="submit">Войти</button>
    </form>
</body>
</html>
