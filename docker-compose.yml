# Продакшен за хостовым nginx (TLS, rate limit): deploy/nginx/plans.conf
# Скопируйте src/vstuplans/.env.example в .env и задайте секреты.
# Postgres — внешний (сеть pg_vstuplans, хост pg-shared). См. docs/deployment.md.

x-app: &app
  build:
    context: .
    dockerfile: src/vstuplans/Dockerfile
  image: vstuplans:${APP_VERSION:-latest}
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: vstuplans.settings
  volumes:
    - userfiles:/app/userfiles
    - staticfiles:/app/staticfiles
    - ./deploy/entrypoint.sh:/opt/deploy/entrypoint.sh:ro
  networks:
    - default
    - pg_vstuplans
  entrypoint: ["/bin/bash", "/opt/deploy/entrypoint.sh"]

services:
  web:
    <<: *app
    restart: unless-stopped
    command:
      [
        "gunicorn",
        "vstuplans.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "3",
        "--timeout",
        "120",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    <<: *app
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command:
      [
        "bash",
        "-c",
        "while true; do python manage.py run_external_sync_worker --once; python manage.py purge_trashed; python manage.py purge_storage_shares; sleep ${WORKER_SLEEP_SECONDS:-300}; done",
      ]

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGHOST: ${PGHOST:-pg-shared}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${POSTGRES_USER:-vstuplans}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      PGDATABASE: ${POSTGRES_DB:-vstuplans}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_COUNT: ${BACKUP_KEEP_COUNT:-14}
    volumes:
      - postgres_backups:/backups
      - ./deploy/backup-loop.sh:/opt/backup-loop.sh:ro
    networks:
      - pg_vstuplans
    entrypoint: ["/bin/bash", "/opt/backup-loop.sh"]

networks:
  pg_vstuplans:
    external: true

volumes:
  postgres_backups:
  userfiles:
  staticfiles:
