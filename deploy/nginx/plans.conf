# Пример server{} для хостового nginx (TLS-сертификаты настраиваются отдельно).
# Подставьте server_name и пути к staticfiles (том Docker или sync после collectstatic).

limit_req_zone $binary_remote_addr zone=plans_login:10m rate=5r/m;

upstream plans_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name plans.example.edu;

    # ssl_certificate /etc/letsencrypt/live/plans.example.edu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/plans.example.edu/privkey.pem;

    client_max_body_size 55m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://plans_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/lib/plans/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /accounts/login/ {
        limit_req zone=plans_login burst=3 nodelay;
        proxy_pass http://plans_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://plans_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
