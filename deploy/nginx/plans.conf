# Хостовой nginx для plx.vstu.ru (TLS через Certbot).
# upstream порт = WEB_PORT из .env / docker-compose (по умолчанию 8006).
# proxy_read_timeout согласован с gunicorn --timeout 120.
# Статику отдаёт WhiteNoise из приложения; отдельный location /static/ не нужен.

limit_req_zone $binary_remote_addr zone=plans_login:10m rate=5r/m;

upstream plans_app {
    server 127.0.0.1:8006;
    keepalive 8;
}

server {
    # nginx < 1.25.1 (на сервере umu): http2 в listen. В новых версиях вместо этого:
    #   listen 443 ssl;  http2 on;
    listen 443 ssl http2;
    server_name plx.vstu.ru;

    # ssl_certificate /etc/letsencrypt/live/plx.vstu.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/plx.vstu.ru/privkey.pem;
    # После первого certbot --nginx -d plx.vstu.ru строки сертификатов появятся автоматически.

    client_max_body_size 55m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://plans_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /accounts/login/ {
        limit_req zone=plans_login burst=3 nodelay;
        proxy_pass http://plans_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://plans_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        send_timeout 120s;
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name plx.vstu.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
